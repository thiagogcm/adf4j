name: Build and Test

# Verify on every push and PR. Do not upload build outputs: release.yml rebuilds
# the native CLI and WASM image and publishes those on the GitHub Release.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so Spotless `ratchetFrom origin/main` can diff against the base.
          fetch-depth: 0

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: "25"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.53.0"

      - name: Build and test
        shell: bash
        # `just verify` runs the tests, produces the JaCoCo report, and enforces the coverage gate.
        run: just verify

      - name: Build native CLI executable
        shell: bash
        run: |
          just native
          if [ -f adf4j-cli/target/adf4j.exe ] || [ -f adf4j-cli/target/adf4j ]; then
            exit 0
          fi
          echo "Executable not found!"
          exit 1

  build-wasm:
    name: Build WASM (Web Image)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: "25"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"
          native-image-job-reports: "true"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.53.0"

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Verify Native Image installation
        run: native-image --version

      # GraalVM's WASM backend needs `wasm-as` from Binaryen >= 119; Ubuntu's apt build is older.
      - name: Install Binaryen (wasm-as)
        shell: bash
        run: |
          BINARYEN=version_130
          curl -fsSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN}/binaryen-${BINARYEN}-x86_64-linux.tar.gz"
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo "/tmp/binaryen-${BINARYEN}/bin" >> "$GITHUB_PATH"
          /tmp/binaryen-${BINARYEN}/bin/wasm-as --version

      - name: Build WASM (web image)
        run: just wasm

      # Prove the wasm actually converts: load it from Node and run the smoke test.
      - name: Smoke-test the wasm from Node
        run: just wasm-smoke

      # Assemble the npm package (resolving the Maven version) and verify the cross-runtime/bundler
      # contract: exports map, declared files, Vite plugin, conversion.
      - name: Assemble and verify npm package
        shell: bash
        run: |
          just wasm-npm
          npm pack dist/npm/adf4j-wasm --dry-run

      - name: Build Chrome extension
        run: just chrome-ext-from-dist
